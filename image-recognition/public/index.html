<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoundYou · Image Recognition</title>
<style>
  :root {
    --bg: #f4f6f8; --surface: #fff; --ink: #17202a; --muted: #5d6875; --line: #dde3e9; --soft: #eef1f4;
    --accent: #2f5bd3; --on-accent: #fff; --good: #1f7a3d; --warn: #a0661a; --empty: #a3acb7;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f151b; --surface: #17202a; --ink: #e6ecf2; --muted: #9aa6b4; --line: #2a3542; --soft: #1e2833;
      --accent: #8eaaff; --on-accent: #0f151b; --good: #6bd18c; --warn: #f0b35a; --empty: #5d6875; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px 16px 64px; }
  .wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 24px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
  h2 { margin: 0; font-size: 17px; }
  .muted { color: var(--muted); }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--soft); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--empty); }
  .dot.on { background: var(--good); }

  .drop { border: 2px dashed var(--line); border-radius: 12px; background: var(--surface); padding: 28px; display: grid; place-items: center; gap: 10px; text-align: center; cursor: pointer; }
  .drop.over { border-color: var(--accent); }
  .drop button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 8px; border: 0; background: var(--accent); color: var(--on-accent); cursor: pointer; }
  .drop button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  .result { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  @media (max-width: 760px) { .result { grid-template-columns: 1fr; } }
  .photo { width: 100%; border-radius: 8px; background: var(--soft); aspect-ratio: 1; object-fit: contain; }
  .status { display: flex; align-items: center; gap: 10px; color: var(--muted); }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  .error { color: #c0392b; font-weight: 500; }

  .headline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; }
  .headline .type { font-size: 22px; font-weight: 700; }
  .caption { margin: 8px 0 14px; font-size: 15px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 7px 0; border-bottom: 1px solid var(--soft); vertical-align: top; }
  td:first-child { width: 160px; color: var(--muted); font-size: 13px; padding-right: 12px; }
  .empty { color: var(--empty); font-style: italic; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 2px 8px; border-radius: 6px; background: var(--soft); font-size: 13px; }
  .sw { display: inline-flex; align-items: center; gap: 6px; }
  .sw i { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); display: inline-block; }
  .src { font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor; margin-left: 6px; }
  .src.exif { color: var(--good); } .src.device { color: var(--accent); } .src.none, .src.server { color: var(--warn); }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  kbd { font: 12px ui-monospace, Menlo, monospace; padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--soft); }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  pre { background: var(--soft); border-radius: 8px; padding: 12px; overflow-x: auto; font-size: 12px; max-height: 420px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; font: inherit; color: inherit; }
  .card:focus-visible { outline: 3px solid var(--accent); }
  .card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--soft); }
  .card div { padding: 8px 10px; display: grid; gap: 2px; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>FoundYou: found an item?</h1>
      <div class="muted">Upload one photo. Everything else is filled in automatically.</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <span class="pill"><span class="dot" id="locDot"></span><span id="locText">Location: asking…</span></span>
      <span class="pill mono" id="model">…</span>
    </div>
  </header>

  <label class="drop" id="drop" for="file">
    <strong>Drop or paste a photo here</strong>
    <span class="muted">Screenshot anything and press <kbd>⌘V</kbd> / <kbd>Ctrl+V</kbd></span>
    <span class="muted">or</span>
    <button type="button" id="pick">Take or choose a photo</button>
    <input id="file" type="file" accept="image/*" capture="environment" hidden>
  </label>

  <section id="out" hidden></section>

  <section style="display:grid;gap:12px">
    <h2>Found items <span class="muted" id="count"></span></h2>
    <div class="grid" id="grid"></div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const SWATCH = { black:"#111", white:"#fff", gray:"#8a8f96", brown:"#7a4b26", beige:"#d9c7a3", red:"#d0312d", orange:"#ef7d22", yellow:"#f2c624", green:"#2e9e4f", blue:"#2f63d1", purple:"#7d43c4", pink:"#ee82b0", silver:"linear-gradient(135deg,#eee,#9aa0a6)", gold:"linear-gradient(135deg,#f6e27a,#b8860b)", clear:"repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0/6px 6px" };
const pretty = (s) => s ? s.replaceAll("_", " ") : s;
const empty = '<span class="empty">empty</span>';

let device = {};
navigator.geolocation?.getCurrentPosition(
  (p) => { device = { lat: p.coords.latitude, lng: p.coords.longitude }; $("locDot").classList.add("on"); $("locText").textContent = "Location: on"; },
  () => { $("locText").textContent = "Location: off (photo GPS only)"; },
  { enableHighAccuracy: true, timeout: 10000 },
);
fetch("/api/health").then((r) => r.json()).then((h) => { $("model").textContent = h.model + (h.key_set ? "" : " · NO KEY"); });

$("pick").onclick = () => $("file").click();
$("file").onchange = (e) => e.target.files[0] && upload(e.target.files[0]);
const drop = $("drop");
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
document.addEventListener("paste", (e) => {
  const file = [...(e.clipboardData?.files || [])].find((f) => f.type.startsWith("image/"));
  if (!file) return;
  e.preventDefault();
  upload(new File([file], file.name && file.name !== "image.png" ? file.name : `pasted-${Date.now()}.png`, { type: file.type }));
});
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); const f = e.dataTransfer.files[0]; f && upload(f); };

async function upload(file) {
  const out = $("out");
  out.hidden = false;
  const preview = URL.createObjectURL(file);
  out.innerHTML = `<div class="result"><img class="photo" src="${preview}" alt="Uploaded photo"><div class="status"><span class="spinner"></span>Reading the photo…</div></div>`;
  const form = new FormData();
  form.append("photo", file);
  if (device.lat != null) { form.append("device_lat", device.lat); form.append("device_lng", device.lng); }
  form.append("device_time", new Date().toISOString());
  try {
    const res = await fetch("/api/items", { method: "POST", body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    show(data);
    loadGrid();
  } catch (e) {
    out.querySelector(".status").innerHTML = `<span class="error">Couldn't process the photo: ${esc(e.message)}</span>`;
  }
  $("file").value = "";
}

function list(xs, swatch = false) {
  if (!xs || !xs.length) return empty;
  return `<div class="chips">${xs.map((x) => swatch ? `<span class="chip sw"><i style="background:${SWATCH[x]}"></i>${esc(x)}</span>` : `<span class="chip">${esc(pretty(x))}</span>`).join("")}</div>`;
}
const val = (v) => (v == null || v === "" ? empty : esc(pretty(v)));

function show(it) {
  const s = it.system;
  const when = new Date(it.found_at).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
  const coords = s.found_lat != null ? `<a class="mono" href="https://maps.google.com/?q=${s.found_lat},${s.found_lng}" target="_blank" rel="noopener">${s.found_lat.toFixed(5)}, ${s.found_lng.toFixed(5)}</a>` : empty;
  $("out").hidden = false;
  $("out").innerHTML = `
  <div class="result">
    <img class="photo" src="${esc(it.image_url)}" alt="${esc(it.caption)}">
    <div>
      <div class="headline"><span class="type">${esc(pretty(it.item_type_other || it.item_type))}</span><span class="muted">${esc(pretty(it.category))} · ${esc(it.id)}</span></div>
      <p class="caption">${esc(it.caption)}</p>
      <table>
        <tr><td>Colors</td><td>${list(it.colors, true)}</td></tr>
        <tr><td>Pattern</td><td>${val(it.pattern)}</td></tr>
        <tr><td>Materials</td><td>${list(it.materials)}</td></tr>
        <tr><td>Brand</td><td>${val(it.brand)}${s.brand_evidence ? ` <span class="muted">· read "${esc(s.brand_evidence)}"</span>` : ""}</td></tr>
        <tr><td>Model</td><td>${val(it.model)}</td></tr>
        <tr><td>Marks</td><td>${list(it.distinguishing_marks)}</td></tr>
        <tr><td>Text on item</td><td>${list(it.detected_text)}</td></tr>
        <tr><td>Search terms</td><td>${list(it.search_terms)}</td></tr>
        <tr><td>Found at</td><td>${esc(when)}<span class="src ${s.time_source}">${s.time_source}</span></td></tr>
        <tr><td>Area</td><td>${val(it.area)}<span class="src ${s.location_source}">${s.location_source}</span></td></tr>
        <tr><td>Coordinates</td><td>${coords}</td></tr>
      </table>
      <div class="meta">
        <span class="pill mono">${(s.extraction.latency_ms / 1000).toFixed(1)}s</span>
        <span class="pill mono">${s.extraction.cost_usd != null ? "$" + s.extraction.cost_usd.toFixed(5) : "cost n/a"}</span>
        <span class="pill mono">${esc(s.extraction.model)} · prompt ${esc(s.extraction.prompt_version)}</span>
      </div>
      <details><summary>Model's observations</summary><p>${esc(s.observations)}</p></details>
      <details><summary>Raw JSON</summary><pre>${esc(JSON.stringify(it, null, 2))}</pre></details>
    </div>
  </div>`;
}

async function loadGrid() {
  const items = await fetch("/api/items").then((r) => r.json());
  $("count").textContent = `(${items.length})`;
  $("grid").innerHTML = items.map((it) => `
    <button class="card" data-id="${esc(it.id)}">
      <img src="${esc(it.image_url)}" alt="" loading="lazy">
      <div><strong>${esc(pretty(it.item_type_other || it.item_type))}</strong><span class="muted">${esc(it.colors.join(", "))}${it.area ? " · " + esc(it.area.split(" (")[0]) : ""}</span></div>
    </button>`).join("");
  $("grid").querySelectorAll(".card").forEach((c) => c.onclick = () => { show(items.find((i) => i.id === c.dataset.id)); window.scrollTo({ top: 0, behavior: "smooth" }); });
}
loadGrid();
</script>
</body>
</html>
